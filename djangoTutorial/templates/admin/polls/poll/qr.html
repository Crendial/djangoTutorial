{% load qr_code %}
<!doctype html>
<html>
<head><meta charset="utf-8"><title>QR code</title></head>
<body style="font-family: sans-serif; text-align: center; padding: 1rem;">
  <p><strong>{{ question.question_text }}</strong></p>
  {% qr_from_text url size="M" %}
  <p><small>{{ url }}</small></p>
</body>
</html>
