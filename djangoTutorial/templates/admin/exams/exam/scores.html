{% extends "admin/base_site.html" %}
{% block content %}
<div id="content-main">
  <table>
    <thead>
      <tr><th>Student</th><th>Score</th><th>Percent</th><th>Submitted</th></tr>
    </thead>
    <tbody>
      {% for a in attempts %}
        <tr>
          <td>{{ a.student.name }}</td>
          <td>{{ a.score }}/{{ a.total }}</td>
          <td>{% widthratio a.score a.total 100 %}%</td>
          <td>{{ a.created|date:"Y-m-d H:i" }}</td>
        </tr>
      {% empty %}
        <tr><td colspan="4">No attempts yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
