<!DOCTYPE html>
{% load static %}
<html lang="fi">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Poll results</title>
        <link rel="stylesheet" href="{% static 'polls/style.css' %}">
    </head>
    <div class="resultContainer">
      <h1>{{ poll.poll_text }}</h1>
      {% for chart in charts %}
        <h2>{{ chart.question }}</h2>
        <canvas id="myChart{{ forloop.counter0 }}" style="max-width: 400px; margin: 0 auto;"></canvas>
      {% endfor %}
      <a id="backToPolls" href="{% url 'polls:index' %}">Back to looking at polls?</a>
    </div>

    {{ charts|json_script:"charts-data" }}
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
    const charts = JSON.parse(document.getElementById("charts-data").textContent);
    charts.forEach((c, i) => {
      new Chart(document.getElementById(`myChart${i}`), {
        type: 'pie',
        data: {
          labels: c.labels,
          datasets: [{
            label: '# of votes',
            data: c.votes,
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'top',
              labels: { color: 'white' }
            },
            title: { display: false }
          }
        }
      });
    });
    </script>
</html>
