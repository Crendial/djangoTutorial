<!DOCTYPE html>
{% load static %}
<html lang="fi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Name yourself</title>
    <link rel="stylesheet" href="{% static 'exams/tailwinded.css' %}">
  </head>
  <body class="min-h-screen bg-gray-900 text-gray-100">
    <header class="bg-gray-950 border-b-3 border-purple-500">
      <div class="mx-auto max-w-5xl px-4 py-6">
        <h1 class="text-3xl font-bold tracking-tight text-white">Exam app</h1>
      </div>
    </header>

    <main class="mx-auto max-w-md px-4 py-10">
      <form method="post"
            class="bg-gray-800 border border-gray-700 rounded-xl p-6
                   [&_p]:mb-4
                   [&_label]:block [&_label]:mb-1 [&_label]:text-sm [&_label]:font-medium [&_label]:text-gray-300
                   [&_input]:w-full [&_input]:rounded-lg [&_input]:bg-gray-900 [&_input]:border [&_input]:border-gray-600
                   [&_input]:px-3 [&_input]:py-2 [&_input]:text-gray-100
                   [&_input]:focus:border-purple-500 [&_input]:focus:outline-none
                   [&_.errorlist]:mb-1 [&_.errorlist]:text-sm [&_.errorlist]:text-red-400">
        {% csrf_token %}
        <h2 class="text-lg font-semibold text-white mb-4">Before you start</h2>
        <input type="hidden" name="next" value="{{ next }}">
        {{ form.as_p }}
        <button type="submit" id="continueBtn"
                class="w-full rounded-lg bg-purple-600 px-4 py-2 text-sm font-medium text-white
                       hover:bg-purple-500 transition">
          Continue
        </button>
      </form>
    </main>
  </body>
</html>
